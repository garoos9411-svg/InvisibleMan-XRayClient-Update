name: CI Build (Windows/WPF)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: Restore
        run: dotnet restore InvisibleMan-XRay.sln
      - name: Build
        run: dotnet build InvisibleMan-XRay.sln -c Release --no-restore
